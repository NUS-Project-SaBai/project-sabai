name: Vitest

on:
  pull_request:
  merge_group:

jobs:
  test:
    name: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      #  CI boots the full local Supabase stack instead of mocking the database.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      # Cache Supabase Docker images so cold runners don't re-pull on every run.
      # Key is tied to supabase/config.toml so the cache busts when the Supabase
      # version or service config changes.
      - name: Cache Supabase Docker images
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/supabase-images.tar.gz
          key: supabase-docker-v2-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar.gz

      # `supabase start` applies the migrations in supabase/migrations.
      - name: Start Supabase
        run: supabase start

      - name: Save Supabase Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | grep '/supabase/' | xargs docker save | gzip > /tmp/supabase-images.tar.gz

      # Map the generated credentials onto the env var names that src/lib/envVariables.ts validates.
      # The Cloudinary/AWS vars aren't exercised by the tests but must be non-empty
      # to pass schema validation at import time.
      - name: Export environment variables
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY}"
            echo "DATABASE_URL=${DB_URL}"
            echo "CLOUDINARY_URL_PREFIX=https://res.cloudinary.com/ci-dummy"
            echo "CLOUDINARY_URL=cloudinary://000000000000000:ci-dummy-secret@ci-dummy"
            echo "AWS_ACCESS_KEY_ID=ci-dummy"
            echo "AWS_SECRET_ACCESS_KEY=ci-dummy"
            echo "AWS_REGION=ap-southeast-1"
            echo "COLLECTION_ID=ci-dummy"
          } >> "$GITHUB_ENV"

      # The integration tests read an existing auth.users row for the doctor FK.
      - name: Seed users
        run: pnpm seed:users

      - name: Run Vitest
        run: pnpm vitest run